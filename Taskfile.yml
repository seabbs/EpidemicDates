version: "3"

tasks:
  setup:
    desc: Install JavaScript and Python dependencies
    cmds:
      - npm ci
      - uv sync
      - julia --project=julia -e 'using Pkg; Pkg.instantiate()'
  test:
    desc: Test the JavaScript and Python code
    cmds:
      - npm test
      - uv run pytest -q --cov=epidemic_dates
  coverage:
    desc: >-
      Coverage for all four packages, with the CI thresholds for Python and
      JavaScript; writes coverage.xml, lcov.info, r/cobertura.xml and
      julia/lcov.info
    cmds:
      - npm run coverage
      - uv run pytest -q --cov=epidemic_dates --cov-report=
      - uv sync --extra jax
      - >-
        uv run --extra jax pytest -q tests/test_jax.py tests/test_jax_import.py
        --cov=epidemic_dates --cov-append --cov-report=term-missing
        --cov-report=xml --cov-fail-under=97
      - >-
        Rscript -e 'cov <- covr::package_coverage("r"); print(cov);
        covr::to_cobertura(cov, "r/cobertura.xml")'
      - julia --project=julia -e 'using Pkg; Pkg.test(coverage = true)'
      - >-
        julia -e 'using Pkg; Pkg.activate(temp = true);
        Pkg.add("CoverageTools"); using CoverageTools;
        c = process_folder("julia/src"); LCOV.writefile("julia/lcov.info", c);
        clean_folder("julia/src"); h, t = get_summary(c);
        println("Julia line coverage: ", round(100h / t; digits = 1), "%")'
  test-jax:
    desc: Test the optional JAX layer, including a NumPyro fit
    cmds:
      - uv sync --extra jax
      - uv run --extra jax pytest -q tests/test_jax.py tests/test_jax_import.py
  sim:
    desc: Run the independent stochastic simulation
    cmds:
      - uv run epidemic-dates {{.CLI_ARGS}}
  lint:
    desc: Lint all four packages (JavaScript, Python, R and Julia)
    cmds:
      - npm run lint
      - npm run format:check
      - npm run typecheck
      - uv run ruff check src tests
      - uv run ruff format --check src tests
      - uv run mypy src
      - task: r-lint
      - task: julia-lint
  docs:
    desc: Build the docs site into _site/, with the interactive page at _site/interactive/
    cmds:
      - >-
        npx --yes jsdoc-to-markdown@9 --no-cache -c docs/jsdoc/jsdoc.json
        epidemic-dates.js > docs/javascript/reference.md
      - uv run --with matplotlib python docs/figures/make_figures.py
      - Rscript docs/r/make_reference.R
      - julia --project=julia docs/julia/make_reference.jl
      - >-
        uv run --with mkdocs-material --with "mkdocstrings[python]"
        mkdocs build --strict
      - mkdir -p _site/interactive
      - cp -R index.html epidemic-dates.js page.js assets _site/interactive/
  r-test:
    desc: Test the R package
    cmds:
      - Rscript -e 'devtools::test("r")'
  r-check:
    desc: R CMD check the R package
    cmds:
      - Rscript -e 'devtools::check("r", document = TRUE, args = "--no-manual")'
  r-format:
    desc: Format the R code with Air
    cmds:
      - uvx --from air-formatter@0.12.0 air format r docs/r
  r-lint:
    desc: Check R formatting with Air and lint with Jarl
    cmds:
      - uvx --from air-formatter@0.12.0 air format --check r docs/r
      - uvx --from jarl-linter@0.7.1 jarl check r docs/r
  julia-test:
    desc: Test the Julia package
    cmds:
      - julia --project=julia -e 'using Pkg; Pkg.test()'
  julia-runic:
    internal: true
    cmds:
      - >-
        julia --startup-file=no --project=@runic -e 'using Pkg;
        Pkg.add(name = "Runic", version = "1.13.0")'
  julia-format:
    desc: Format the Julia code with Runic
    deps: [julia-runic]
    cmds:
      - julia --startup-file=no --project=@runic -m Runic --inplace julia docs/julia
  julia-lint:
    desc: Check Julia formatting with Runic
    deps: [julia-runic]
    cmds:
      - julia --startup-file=no --project=@runic -m Runic --check --diff julia docs/julia
  serve:
    desc: Serve the page locally
    cmds:
      - python3 -m http.server 8000
