version: "3"

tasks:
  test:
    desc: Test the JavaScript and Python code
    cmds:
      - node --test "tests/*.test.mjs"
      - uv run pytest -q
  sim:
    desc: Run the independent stochastic simulation
    cmds:
      - uv run onset-imputation {{.CLI_ARGS}}
  lint:
    desc: Lint the JavaScript and Python code
    cmds:
      - npx --yes eslint@10 .
      - uv run ruff check src tests
      - uv run ruff format --check src tests
  docs:
    desc: Build the JavaScript and Python API docs into _site/
    cmds:
      - npx --yes jsdoc@4 -c jsdoc.json -d _site/js
      - uv run --with pdoc pdoc onset_imputation -o _site/python --docformat numpy --math
  serve:
    desc: Serve the page locally
    cmds:
      - python3 -m http.server 8000
