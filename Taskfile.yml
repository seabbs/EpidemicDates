version: "3"

tasks:
  test:
    desc: Test the JavaScript and Python code
    cmds:
      - node --test "tests/*.test.mjs"
      - uv run pytest -q
  sim:
    desc: Run the independent stochastic simulation
    cmds:
      - uv run imputation-sim {{.CLI_ARGS}}
  lint:
    desc: Lint and format-check the Python code
    cmds:
      - uv run ruff check src tests
      - uv run ruff format --check src tests
  serve:
    desc: Serve the page locally
    cmds:
      - python3 -m http.server 8000
