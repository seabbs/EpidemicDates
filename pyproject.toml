[project]
name = "epidemic-imputation-demonstration"
version = "0.1.0"
description = "Simulation cross-check for onset-date imputation by back-sampling reporting delays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
imputation-sim = "imputation_sim:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 80

[tool.uv.build-backend]
module-name = "imputation_sim"
