<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img">
  <title>EpidemicDates mark (on a coloured header)</title>
  <!-- Epidemic curve of onsets -->
  <path d="M2 20C9 20 11 3.5 16.5 3.5S24 20 30 20Z"
        fill="#ffffff" fill-opacity="0.25"/>
  <path d="M2 20C9 20 11 3.5 16.5 3.5S24 20 30 20"
        fill="none" stroke="#ffffff" stroke-width="2.4"
        stroke-linecap="round"/>
  <!-- Arrow from the report date back to the onset date -->
  <path d="M12.5 26.5H21.5M15.5 23.5l-3 3 3 3"
        fill="none" stroke="#ffffff" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Onset date (dot) and report date (square) -->
  <circle cx="7.5" cy="26.5" r="3.5" fill="#ffffff"/>
  <rect x="21.5" y="23" width="7" height="7" rx="1" fill="#eb6834"/>
</svg>
