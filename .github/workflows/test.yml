name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check sim
      - run: uv run ruff format --check sim
      - run: uv run sim/sim_onset_imputation.py 2
