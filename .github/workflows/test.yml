name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: JavaScript (ESLint, prettier, type-check)
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
      - name: Python (ruff, mypy)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: JavaScript tests (module and page)
        run: npm test
      - name: Python tests, with the JavaScript cross-check
        run: uv run pytest -q --cov=epidemic_dates --cov-report=term-missing
      - name: Command line smoke test
        run: uv run epidemic-dates --reps 2 --scenarios A W --out output
      - name: Python JAX layer, including a NumPyro fit
        run: |
          uv sync --extra jax
          uv run --extra jax pytest -q tests/test_jax.py tests/test_jax_import.py

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::lintr, any::styler, any::devtools, any::jsonlite
          needs: check
      - name: Tests, including the cross-language fixtures
        run: Rscript -e 'devtools::test("r", stop_on_failure = TRUE)'
      - name: Lint and style check
        run: |
          Rscript -e 'pkgload::load_all("r"); l <- lintr::lint_package("r"); print(l); if (length(l)) quit(status = 1)'
          Rscript -e 's <- styler::style_pkg("r", dry = "fail")'
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - uses: r-lib/actions/setup-r@v2
      - name: R API reference
        run: Rscript docs/r/make_reference.R
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Generate the Julia reference
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia docs/julia/make_reference.jl
      - name: Build the docs site
        run: |
          npx --yes jsdoc-to-markdown@9 --no-cache -c docs/jsdoc/jsdoc.json epidemic-dates.js > docs/javascript/reference.md
          uv run --with matplotlib python docs/figures/make_figures.py
          uv run --with mkdocs-material --with "mkdocstrings[python]" mkdocs build --strict
