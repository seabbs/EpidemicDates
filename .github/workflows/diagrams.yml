# Checks that the TikZ method diagrams compile.
# The SVGs are committed, so this only guards the sources.
# Runs when docs/diagrams/ changes. Run by hand with workflow_dispatch.
name: Diagrams

on:
  push:
    branches: [main]
    paths: &paths
      - "docs/diagrams/**"
      - ".github/workflows/diagrams.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A minimal, cached TeX Live with only what style.tex needs.
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-infraonly
            latex-bin
            amsfonts
            amsmath
            cm
            ec
            epstopdf-pkg
            graphics
            graphics-cfg
            helvetic
            iftex
            pgf
            preview
            psnfss
            standalone
            xcolor
            xkeyval
      - name: Install poppler
        run: |
          command -v pdftocairo || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils
          }
      - name: Compile the diagrams
        run: docs/diagrams/build.sh
