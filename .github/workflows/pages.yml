name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the interactive page
        run: mkdir -p _site && cp -R index.html epidemic-dates.js page.js assets _site/
      - name: Copy redirects from the old API docs
        run: cp -R docs-redirects/. _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Generate the JavaScript reference
        run: >-
          npx --yes jsdoc-to-markdown@9 --no-cache -c docs/jsdoc/jsdoc.json
          epidemic-dates.js > docs/javascript/reference.md
      - name: Make the docs figures
        run: uv run --with matplotlib python docs/figures/make_figures.py
      - uses: r-lib/actions/setup-r@v2
      - name: Generate the R reference
        run: Rscript docs/r/make_reference.R
      - name: Build the docs into _site/docs
        run: >-
          uv run --with mkdocs-material --with "mkdocstrings[python]"
          mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
