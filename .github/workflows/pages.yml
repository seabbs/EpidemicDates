# Builds the docs and the interactive page and deploys them to GitHub Pages.
# Runs on main when the docs or any source they render from change.
# Run by hand with workflow_dispatch to redeploy.
# Not cancelled by the test concurrency rule; the pages group below
# keeps one deploy at a time.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "epidemic-dates.js"
      - "page.js"
      - "index.html"
      - "assets/**"
      - "r/R/**"
      - "r/man/**"
      - "r/DESCRIPTION"
      - "julia/src/**"
      - "julia/Project.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Generate the JavaScript reference
        run: >-
          npx --yes jsdoc-to-markdown@9 --no-cache -c docs/jsdoc/jsdoc.json
          epidemic-dates.js > docs/javascript/reference.md
      - name: Make the docs figures
        run: uv run --with matplotlib python docs/figures/make_figures.py
      - uses: r-lib/actions/setup-r@v2
      - name: Generate the R reference
        run: Rscript docs/r/make_reference.R
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Generate the Julia reference
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia docs/julia/make_reference.jl
      - name: Build the docs into _site
        run: >-
          uv run --with mkdocs-material --with "mkdocstrings[python]"
          mkdocs build --strict
      - name: Add the interactive page under /interactive/
        run: |
          mkdir -p _site/interactive
          cp -R index.html epidemic-dates.js page.js assets _site/interactive/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
