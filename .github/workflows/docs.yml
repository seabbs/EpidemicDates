# Docs build check for pull requests and main.
# Runs when the docs or any source they render from change: the Python,
# JavaScript, R and Julia sources, the interactive page and the figures.
# Run by hand with workflow_dispatch.
name: Docs build

on:
  push:
    branches: [main]
    paths: &paths
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "epidemic-dates.js"
      - "page.js"
      - "index.html"
      - "assets/**"
      - "r/R/**"
      - "r/man/**"
      - "r/DESCRIPTION"
      - "julia/src/**"
      - "julia/Project.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: r-lib/actions/setup-r@v2
      - name: R API reference
        run: Rscript docs/r/make_reference.R
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Generate the Julia reference
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia docs/julia/make_reference.jl
      - name: Build the docs site
        run: |
          npx --yes jsdoc-to-markdown@9 --no-cache -c docs/jsdoc/jsdoc.json epidemic-dates.js > docs/javascript/reference.md
          uv run --with matplotlib python docs/figures/make_figures.py
          uv run --with mkdocs-material --with "mkdocstrings[python]" mkdocs build --strict
