# Julia package: tests with coverage.
# Runs when the Julia package or the shared cross-language fixtures change.
# Run by hand with workflow_dispatch.
name: Julia package

on:
  push:
    branches: [main]
    paths: &paths
      - "julia/**"
      - "tests/fixtures/**"
      - ".github/workflows/julia.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: julia/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
