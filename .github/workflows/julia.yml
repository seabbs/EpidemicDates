name: Julia package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: julia
